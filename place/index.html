<!DOCTYPE html>
<html>
<head>
<script src="/cookie-consent.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlie's Recos</title>
  <meta property="og:title" content="Charlie's Recos">
  <meta property="og:description" content="Ortsempfehlung von einem Freund">
  <meta property="og:image" content="https://www.getcharlie.app/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #F3F5FA; color: #10172A; min-height: 100vh; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 5vw; background: #fff; border-bottom: 1px solid #E8ECF4; }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo { width: 32px; height: 32px; background: #C62828; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 16px; }
    .nav-name { font-weight: 900; font-size: 18px; color: #10172A; }
    nav a.back { text-decoration: none; color: #55627D; font-size: 14px; font-weight: 500; }
    nav a.back:hover { color: #10172A; }
    .content { max-width: 480px; margin: 40px auto; padding: 0 5vw 80px; }
    .card { background: #fff; border-radius: 20px; overflow: hidden; border: 1px solid #E8ECF4; }
    .card-photo { width: 100%; height: 220px; object-fit: cover; display: block; }
    .card-photo-placeholder { width: 100%; height: 160px; background: linear-gradient(135deg, #FDE8E8 0%, #F5C6C6 100%); display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .card-body { padding: 20px; }
    .cat-badge { display: inline-flex; align-items: center; gap: 6px; background: #FDE8E8; color: #C62828; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; }
    h1 { font-size: 1.4rem; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
    .address { color: #55627D; font-size: 14px; margin-bottom: 10px; }
    .note { color: #55627D; font-size: 14px; line-height: 1.6; padding: 12px; background: #F3F5FA; border-radius: 10px; margin-bottom: 2px; }
    .actions { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .btn-primary { display: block; width: 100%; padding: 14px; background: #C62828; color: #fff; font-weight: 700; font-size: 15px; border: none; border-radius: 12px; cursor: pointer; text-align: center; text-decoration: none; }
    .btn-primary:hover { background: #b71c1c; }
    .store-row { display: flex; gap: 10px; }
    .btn-store { flex: 1; display: block; padding: 12px 10px; background: #10172A; color: #fff; font-weight: 600; font-size: 13px; border-radius: 12px; text-align: center; text-decoration: none; }
    .btn-store:hover { background: #1e293b; }
    .store-hint { font-size: 10px; font-weight: 400; opacity: 0.7; display: block; }
    .divider { text-align: center; color: #8B93A7; font-size: 12px; margin: 4px 0; }
    .spinner { display: flex; justify-content: center; align-items: center; padding: 60px 0; }
    .spinner svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-card { text-align: center; padding: 40px 20px; }
    .error-icon { font-size: 40px; margin-bottom: 12px; }
    .error-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
    .error-sub { color: #55627D; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
  </style>
</head>
<body>
<nav>
  <a class="nav-brand" href="/">
    <div class="nav-logo">C</div>
    <span class="nav-name">Charlie</span>
  </a>
  <a class="back" href="/">← Charlie</a>
</nav>
<div class="content">
  <div id="root">
    <div class="spinner">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#E8ECF4" stroke-width="3"/>
        <path d="M12 2a10 10 0 0 1 10 10" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
</div>

<script>
  // i18n
  const lang = (navigator.language || 'en').split('-')[0];
  const T = {
    de: { openApp: 'In App öffnen', iosStore: 'App Store', androidStore: 'Google Play', orDownload: 'oder App herunterladen', privateTitle: 'Privater Ort', privateMsg: 'Dieser Ort ist nur für Freunde sichtbar. Lade Charlie herunter, um ihn zu sehen.', notFoundTitle: 'Ort nicht gefunden', notFoundMsg: 'Dieser Link ist abgelaufen oder der Ort wurde entfernt.', downloadFree: 'Kostenlos herunterladen', from: 'von' },
    en: { openApp: 'Open in App', iosStore: 'App Store', androidStore: 'Google Play', orDownload: 'or download the app', privateTitle: 'Private place', privateMsg: 'This place is only visible to friends. Download Charlie to see it.', notFoundTitle: 'Place not found', notFoundMsg: 'This link has expired or the place was removed.', downloadFree: 'Download for free', from: 'from' },
    fr: { openApp: 'Ouvrir dans l\'app', iosStore: 'App Store', androidStore: 'Google Play', orDownload: 'ou télécharger l\'app', privateTitle: 'Endroit privé', privateMsg: 'Cet endroit n\'est visible que par les amis. Télécharge Charlie pour le voir.', notFoundTitle: 'Endroit introuvable', notFoundMsg: 'Ce lien a expiré ou l\'endroit a été supprimé.', downloadFree: 'Télécharger gratuitement', from: 'de' },
    es: { openApp: 'Abrir en la app', iosStore: 'App Store', androidStore: 'Google Play', orDownload: 'o descargar la app', privateTitle: 'Lugar privado', privateMsg: 'Este lugar solo es visible para amigos. Descarga Charlie para verlo.', notFoundTitle: 'Lugar no encontrado', notFoundMsg: 'Este enlace ha caducado o el lugar fue eliminado.', downloadFree: 'Descargar gratis', from: 'de' },
  };
  const s = T[lang] || T.en;

  const IOS_URL = 'https://apps.apple.com/app/id6762520662';
  const ANDROID_URL = 'https://play.google.com/store/apps/details?id=app.getcharlie.app';
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);

  const catEmoji = {
    'Restaurant': '🍽️', 'Café': '☕', 'Bar': '🍸', 'Club': '🎵', 'Hotel': '🏨',
    'Sehenswürdigkeit': '🏛️', 'Museum': '🏛️', 'Natur': '🌿', 'Park': '🌳',
    'Shopping': '🛍️', 'Sport': '🏃', 'Kultur': '🎭', 'Strand': '🏖️',
    'Bakery': '🥐', 'Coffee': '☕', 'Nature': '🌿', 'Sights': '🏛️',
    'Beach': '🏖️', 'Fitness': '🏃', 'Culture': '🎭',
  };

  function storeButtons() {
    if (isIOS) {
      return `<a class="btn-store" href="${IOS_URL}"><span class="store-hint">↓ ${s.downloadFree}</span>${s.iosStore}</a>`;
    }
    if (isAndroid) {
      return `<a class="btn-store" href="${ANDROID_URL}"><span class="store-hint">↓ ${s.downloadFree}</span>${s.androidStore}</a>`;
    }
    return `
      <a class="btn-store" href="${IOS_URL}"><span class="store-hint">↓ iPhone</span>${s.iosStore}</a>
      <a class="btn-store" href="${ANDROID_URL}"><span class="store-hint">↓ Android</span>${s.androidStore}</a>`;
  }

  function openInApp(placeId) {
    window.location.href = 'charlie://place/' + placeId;
    setTimeout(() => {
      if (!document.hidden) {
        window.location.href = isIOS ? IOS_URL : ANDROID_URL;
      }
    }, 1500);
  }

  function getStr(fields, key) {
    return fields[key]?.stringValue || '';
  }

  function renderPlace(fields, placeId) {
    const title = getStr(fields, 'title') || 'Charlie\'s Reco';
    const address = getStr(fields, 'address');
    const category = getStr(fields, 'category');
    const note = getStr(fields, 'note');
    const photos = fields.photos?.arrayValue?.values;
    const photoUrl = photos?.[0]?.stringValue || '';
    const emoji = catEmoji[category] || '📍';

    document.title = title + ' — Charlie\'s Recos';

    const photoHtml = photoUrl
      ? `<img class="card-photo" src="${photoUrl}" alt="${title}" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="card-photo-placeholder">${emoji}</div>`;

    const catHtml = category ? `<div class="cat-badge">${emoji} ${category}</div>` : '';
    const addrHtml = address ? `<div class="address">📍 ${address}</div>` : '';
    const noteHtml = note ? `<div class="note">"${note}"</div>` : '';

    const openBtnHtml = (isIOS || isAndroid)
      ? `<button class="btn-primary" onclick="openInApp('${placeId}')">${s.openApp}</button><div class="divider">${s.orDownload}</div>`
      : '';

    document.getElementById('root').innerHTML = `
      <div class="card">
        ${photoHtml}
        <div class="card-body">
          ${catHtml}
          <h1>${title}</h1>
          ${addrHtml}
          ${noteHtml}
          <div class="actions">
            ${openBtnHtml}
            <div class="store-row">${storeButtons()}</div>
          </div>
        </div>
      </div>`;
  }

  function renderError(icon, title, msg) {
    document.getElementById('root').innerHTML = `
      <div class="card error-card">
        <div class="error-icon">${icon}</div>
        <div class="error-title">${title}</div>
        <div class="error-sub">${msg}</div>
        <div class="store-row">${storeButtons()}</div>
      </div>`;
  }

  async function loadPlace(placeId) {
    try {
      const r = await fetch(
        'https://firestore.googleapis.com/v1/projects/charlie-s-recos/databases/(default)/documents/places/'
        + placeId + '?key=AIzaSyAlh4BUzZ9pHCRAUQ8rt7y1SrfLGHMAx0I'
      );
      if (r.status === 403 || r.status === 401) {
        renderError('🔒', s.privateTitle, s.privateMsg);
      } else if (!r.ok) {
        renderError('🔍', s.notFoundTitle, s.notFoundMsg);
      } else {
        const data = await r.json();
        renderPlace(data.fields || {}, placeId);
      }
    } catch {
      renderError('🔍', s.notFoundTitle, s.notFoundMsg);
    }
  }

  const placeId = location.pathname.match(/\/place\/([^/?#]+)/)?.[1];
  if (placeId) {
    loadPlace(placeId);
  } else {
    renderError('🔍', s.notFoundTitle, s.notFoundMsg);
  }
</script>
</body>
</html>
